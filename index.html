<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>悬浮空岛·五重塔与落樱飞瀑 (次世代PBR琉璃光影版) | Voxel Floating Island</title>
  <style>
    :root {
      --glass-bg: rgba(16, 20, 34, 0.64);
      --glass-border: rgba(255, 220, 235, 0.20);
      --glass-highlight: rgba(255, 255, 255, 0.10);
      --accent-sakura: #ff8da1;
      --accent-gold: #e6c15a;
      --text-primary: #fff8fa;
      --text-secondary: rgba(244, 228, 236, 0.76);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f1d;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text-primary);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 左上角艺术标题水印 */
    .brand-header {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ffd6e0;
      background: linear-gradient(90deg, rgba(255, 141, 161, 0.22), rgba(212, 175, 55, 0.18));
      border: 1px solid rgba(255, 180, 198, 0.35);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .brand-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      background: linear-gradient(135deg, #ffffff 0%, #ffe0e9 48%, #f3c663 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 12.5px;
      color: var(--text-secondary);
      letter-spacing: 0.6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.65);
    }

    /* 右上角极简毛玻璃控制面板 */
    .ui-panel {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 20;
      width: 306px;
      padding: 18px 20px;
      border-radius: 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.46),
        inset 0 1px 0 var(--glass-highlight);
      backdrop-filter: blur(18px) saturate(165%);
      -webkit-backdrop-filter: blur(18px) saturate(165%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .ui-panel:hover {
      border-color: rgba(255, 198, 216, 0.36);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .panel-title {
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.8px;
      color: #fff0f5;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .voxel-stat {
      font-size: 11px;
      font-family: "SF Mono", "Consolas", monospace;
      color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.34);
      padding: 2px 8px;
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .control-value {
      font-family: "SF Mono", "Consolas", monospace;
      font-size: 11.5px;
      color: var(--text-primary);
    }

    /* 昼夜切换双按钮 */
    .mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(8, 10, 20, 0.52);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .mode-btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 9px 8px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      color: var(--text-secondary);
      background: transparent;
      transition: all 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .mode-btn:hover {
      color: #ffffff;
    }

    .mode-btn.active[data-mode="sunset"] {
      color: #fffaf5;
      background: linear-gradient(135deg, rgba(255, 136, 102, 0.9), rgba(218, 92, 148, 0.9));
      box-shadow: 0 4px 14px rgba(255, 120, 130, 0.42);
    }

    .mode-btn.active[data-mode="night"] {
      color: #f4f8ff;
      background: linear-gradient(135deg, rgba(52, 84, 182, 0.92), rgba(112, 64, 178, 0.92));
      box-shadow: 0 4px 14px rgba(82, 108, 235, 0.45);
    }

    /* 开关行 */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      inset: 0;
      background-color: rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      transition: 0.28s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .slider-toggle::before {
      content: "";
      position: absolute;
      height: 18px;
      width: 18px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }

    .switch input:checked + .slider-toggle {
      background: linear-gradient(135deg, #ff8da1, #f0b653);
      border-color: rgba(255, 200, 210, 0.55);
    }

    .switch input:checked + .slider-toggle::before {
      transform: translateX(20px);
    }

    /* 滑块样式 */
    .range-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      cursor: pointer;
    }

    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff94ad;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 8px rgba(255, 110, 155, 0.65);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .range-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    /* 视角快捷按钮组 */
    .camera-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding-top: 2px;
    }

    .cam-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 6px 4px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cam-btn:hover {
      background: rgba(255, 158, 187, 0.20);
      color: #ffffff;
      border-color: rgba(255, 158, 187, 0.45);
    }

    /* 底部操作提示栏 */
    .footer-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      pointer-events: none;
      padding: 7px 18px;
      border-radius: 999px;
      background: rgba(14, 18, 30, 0.56);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      font-size: 11.5px;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      .brand-header {
        top: 14px;
        left: 16px;
      }
      .brand-title {
        font-size: 18px;
      }
      .ui-panel {
        top: auto;
        bottom: 16px;
        right: 16px;
        left: 16px;
        width: auto;
      }
      .footer-hint {
        display: none;
      }
    }
  </style>

      "imports": {

</head>
<body>
  <div id="canvas-container"></div>

  <!-- 左上角标题 -->
  <header class="brand-header">
    <div class="brand-badge">NEXT-GEN PBR VOXEL DIORAMA</div>
    <h1 class="brand-title">悬浮空岛 · 五重塔与落樱飞瀑</h1>
    <p class="brand-subtitle">Glazed Tiles · Gilded Ridges · Micro-Bevel AO &amp; Crystalline Waterfall</p>
  </header>

  <!-- 右上角毛玻璃交互控制栏 -->
  <aside class="ui-panel" aria-label="场景控制面板">
    <div class="panel-header">
      <div class="panel-title">
        <span>⛩️ 景观控制台</span>
      </div>
      <span class="voxel-stat" id="voxel-count-badge">0 Voxels</span>
    </div>

    <!-- 昼夜氛围切换 -->
    <div class="control-group">
      <div class="control-label">
        <span>昼夜光影氛围</span>
        <span class="control-value" id="mode-label">春日夕照</span>
      </div>
      <div class="mode-switcher">
        <button type="button" class="mode-btn active" data-mode="sunset" id="btn-sunset">
          🌸 春日夕照

        <button type="button" class="mode-btn" data-mode="night" id="btn-night">
          🌙 萤火夜樱
        </button>
      </div>
    </div>

    <!-- 自动环绕运镜开关 -->
    <div class="toggle-row">
      <span class="control-label" style="margin:0;">自动环绕运镜 (Auto-Rotate)</span>
      <label class="switch">
        <input type="checkbox" id="toggle-autorotate" checked />
        <span class="slider-toggle"></span>
      </label>
    </div>

    <!-- 落樱密度滑块 -->
    <div class="control-group">
      <div class="control-label">
        <span>漫天落樱密度</span>

      <input
        type="range"
        class="range-slider"

    <!-- 快捷机位切换 -->
    <div class="control-group">
      <div class="control-label">
        <span>电影机位视角</span>

      <div class="camera-presets">
        <button type="button" class="cam-btn" data-cam="overview">全景</button>
        <button type="button" class="cam-btn" data-cam="pagoda">五重塔</button>
        <button type="button" class="cam-btn" data-cam="bridge">朱红拱桥</button>
        <button type="button" class="cam-btn" data-cam="waterfall">飞瀑崖</button>
      </div>
    </div>
  </aside>

  <div class="footer-hint">
    🖱️ 左键拖拽旋转 · 滚轮缩放远近 · 右键拖拽平移 · 顶部切换「🌸 春日夕照 / 🌙 萤火夜樱」
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';

    // ============================================================================
    // 1. 确定性伪随机数与多层分形噪声（保证地形与建筑严丝合缝零悬空）
    // ============================================================================
    class SeededRandom {
      constructor(seed = 20260413) {
        this.s = seed >>> 0;
      }
      next() {
        this.s = (1664525 * this.s + 1013904223) >>> 0;
        return this.s / 4294967296;
      }
      range(min, max) {
        return min + this.next() * (max - min);
      }
      int(min, max) {
        return Math.floor(this.range(min, max + 1));
      }
    }

    function hash2D(ix, iz) {
      let n = Math.imul(ix, 374761393) + Math.imul(iz, 668265263);
      n = (n ^ (n >>> 13)) >>> 0;
      n = Math.imul(n, 1274126177) >>> 0;
      return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
    }

    function smoothNoise2D(x, z, scale = 1) {
      const sx = x / scale;
      const sz = z / scale;
      const ix = Math.floor(sx);
      const iz = Math.floor(sz);
      const fx = sx - ix;
      const fz = sz - iz;
      const ux = fx * fx * (3 - 2 * fx);
      const uz = fz * fz * (3 - 2 * fz);

      const a = hash2D(ix, iz);
      const b = hash2D(ix + 1, iz);
      const c = hash2D(ix, iz + 1);
      const d = hash2D(ix + 1, iz + 1);

      return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
    }

    function fbm2D(x, z) {
      return (
        0.55 * smoothNoise2D(x, z, 11) +
        0.30 * smoothNoise2D(x + 31, z - 19, 5.5) +
        0.15 * smoothNoise2D(x - 17, z + 43, 2.7)
      );
    }

    // 4×4 Bayer 有序抖动矩阵（模拟《乐高大电影》与顶级像素材质包的细腻颗粒层次）
    const BAYER_4X4 = [
      [ 0,  8,  2, 10],
      [12,  4, 14,  6],
      [ 3, 11,  1,  9],
      [15,  7, 13,  5]
    ];

    // ============================================================================
    // 2. 次世代 16×16 微倒角（Bevel）+ 抖动（Dithering）像素贴图生成器
    // ============================================================================
    function hexToRgb(hex) {
      const n = parseInt(hex.replace('#', ''), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function clampByte(v) {
      return Math.max(0, Math.min(255, Math.round(v)));
    }

    function createPixelTexture(baseHex, options = {}) {
      const {
        noiseAmp = 14,
        ditherAmp = 9,
        pattern = 'noise',
        secondaryHex = null,
        accentHex = null,
        bevel = 0.22,
        repeat = false,
        seed = 101
      } = options;

      const canvas = document.createElement('canvas');
      canvas.width = 16;
      canvas.height = 16;
      const ctx = canvas.getContext('2d');
      const [br, bg, bb] = hexToRgb(baseHex);
      const sec = secondaryHex ? hexToRgb(secondaryHex) : null;
      const acc = accentHex ? hexToRgb(accentHex) : null;
      const localRng = new SeededRandom(seed);

      for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
          let r = br;
          let g = bg;
          let b = bb;

          // 1. 细腻色彩抖动 (Bayer Dithering) + 随机像素颗粒
          const bayerVal = (BAYER_4X4[y & 3][x & 3] / 15.0 - 0.5) * 2.0 * ditherAmp;
          const randVal = (localRng.next() - 0.5) * 2.0 * noiseAmp;
          const delta = bayerVal * 0.65 + randVal * 0.75;
          r += delta;
          g += delta;
          b += delta;

          // 2. 专属程序化材质纹理
          if (pattern === 'grassSide' && sec) {
            const grassLip = 3 + Math.floor(hash2D(x + seed, 0) * 3);
            if (y < grassLip) {
              r = sec[0] + delta * 0.85;
              g = sec[1] + delta * 0.85;
              b = sec[2] + delta * 0.85;
              if (y === grassLip - 1) {
                r *= 0.82;
                g *= 0.86;
                b *= 0.80;
              }
            }
          } else if (pattern === 'glazedTile') {
            // 青黛琉璃瓦（#263238 ~ #37474f）：清晰的纵向瓦垄凹凸 + 横向瓦当叠影 + 釉面高光脊
            const colPhase = x % 4;
            if (colPhase === 0) {
              // 瓦沟深槽
              r *= 0.72;
              g *= 0.75;
              b *= 0.78;
            } else if (colPhase === 2) {
              // 筒瓦高光凸脊（反射青瓷冷高光）
              r += 24;
              g += 32;
              b += 38;
            } else {
              r += 8;
              g += 12;
              b += 15;
            }
            // 横向叠瓦阶梯暗线与亮唇
            if (y % 5 === 0) {
              r *= 0.70;
              g *= 0.72;
              b *= 0.76;
            } else if (y % 5 === 1) {
              r += 16;
              g += 20;
              b += 24;
            }
          } else if (pattern === 'gildedRidge' && sec) {
            // 鎏金与朱红交织的装饰屋脊纹理
            const isGoldBand = (x >= 2 && x <= 13 && y >= 2 && y <= 13) && ((x + y) % 3 !== 0);
            if (!isGoldBand) {
              r = sec[0] + delta * 0.4;
              g = sec[1] + delta * 0.4;
              b = sec[2] + delta * 0.4;
            } else {
              // 金属浮雕高光花纹
              const spec = Math.sin(x * 0.8) * Math.cos(y * 0.8) * 22;
              r += spec;
              g += spec * 0.85;
              b += spec * 0.4;
            }
          } else if (pattern === 'brick' && sec) {
            const isRow = y % 4 === 0;
            const offset = Math.floor(y / 4) % 2 === 0 ? 0 : 4;
            const isCol = (x + offset) % 8 === 0;
            if (isRow || isCol) {
              r = sec[0] + delta * 0.3;
              g = sec[1] + delta * 0.3;
              b = sec[2] + delta * 0.3;
            }
          } else if (pattern === 'mossyCobble' && sec) {
            // 青苔石块：石块缝隙中蜿蜒生长翠绿青苔
            const cobbleEdge = ((x + (y % 3)) % 5 === 0) || ((y + (x % 4)) % 5 === 0);
            const mossPatch = smoothNoise2D(x + seed, y - seed, 3.2) > 0.46;
            if (cobbleEdge || mossPatch) {
              r = sec[0] + delta * 0.55;
              g = sec[1] + delta * 0.65;
              b = sec[2] + delta * 0.45;
            }
          } else if (pattern === 'wood') {
            const streak = Math.sin((x * 0.95) + localRng.next() * 0.35) * 11;
            r += streak;
            g += streak * 0.65;
            b += streak * 0.65;
          } else if (pattern === 'plaster' && sec) {
            if (x <= 1 || x >= 14 || y <= 1 || y >= 14) {
              r = sec[0];
              g = sec[1];
              b = sec[2];
            }
          } else if (pattern === 'window' && sec) {
            const frame =
              x === 0 || x === 15 || y === 0 || y === 15 ||
              x === 5 || x === 10 || y === 5 || y === 10;
            if (frame) {
              r = sec[0];
              g = sec[1];
              b = sec[2];
            } else {
              const glow = 16 - Math.hypot(x - 7.5, y - 7.5) * 1.4;
              r += glow;
              g += glow * 0.85;
            }
          } else if (pattern === 'basalt') {
            const colShade = ((x % 4 === 0) ? -15 : (x % 2 === 0 ? 8 : -4));
            r += colShade;
            g += colShade;
            b += colShade * 1.15;
          } else if (pattern === 'ore' && acc) {
            const d1 = Math.hypot(x - 4, y - 5);
            const d2 = Math.hypot(x - 11, y - 10);
            const d3 = Math.hypot(x - 6, y - 12);
            if (d1 < 2.4 || d2 < 2.6 || d3 < 2.0) {
              r = acc[0] + delta;
              g = acc[1] + delta;
              b = acc[2] + delta;
            }
          } else if (pattern === 'bamboo' && sec) {
            if (y === 0 || y === 8) {
              r = sec[0];
              g = sec[1];
              b = sec[2];
            } else if (x === 3 || x === 11) {
              r += 16;
              g += 20;
              b += 8;
            }
          } else if (pattern === 'leaves' && sec) {
            if (localRng.next() < 0.34 || ((x + y) % 3 === 0 && localRng.next() < 0.5)) {
              r = sec[0] + delta * 0.55;
              g = sec[1] + delta * 0.55;
              b = sec[2] + delta * 0.55;
            }
          } else if (pattern === 'lantern' && sec) {
            const border = x <= 1 || x >= 14 || y <= 1 || y >= 14 || y === 7;
            if (border) {
              r = sec[0];
              g = sec[1];
              b = sec[2];
            }
          } else if (pattern === 'waterFlow' && sec) {
            // 瀑布纵向流动水纹与白沫条带
            const wave = Math.sin(y * 0.85 + Math.sin(x * 0.9) * 1.6);
            if (wave > 0.35) {
              r = sec[0] + delta * 0.4;
              g = sec[1] + delta * 0.4;
              b = sec[2] + delta * 0.4;
            } else if (x % 4 === 1 && y % 3 !== 0) {
              r += 28;
              g += 34;
              b += 38;
            }
          }

          // 3. 外圈 1px 微倒角高光边 (Top/Left 偏亮，Bottom/Right 偏暗) + 次外圈 1px 柔和立体过渡
          if (!repeat && bevel > 0) {
            const isTop = y === 0;
            const isLeft = x === 0;
            const isBottom = y === 15;
            const isRight = x === 15;

            if ((isTop || isLeft) && !(isBottom || isRight)) {
              const boost = (isTop && isLeft) ? bevel * 1.15 : bevel * 0.82;
              r += (255 - r) * boost;
              g += (255 - g) * boost;
              b += (255 - b) * boost;
            } else if ((isBottom || isRight) && !(isTop || isLeft)) {
              const shade = (isBottom && isRight) ? bevel * 1.25 : bevel * 0.95;
              r *= (1 - shade);
              g *= (1 - shade);
              b *= (1 - shade);
            } else if (x === 1 || y === 1) {
              r += (255 - r) * (bevel * 0.22);
              g += (255 - g) * (bevel * 0.22);
              b += (255 - b) * (bevel * 0.22);
            } else if (x === 14 || y === 14) {
              r *= (1 - bevel * 0.25);
              g *= (1 - bevel * 0.25);
              b *= (1 - bevel * 0.25);
            }
          }

          ctx.fillStyle = `rgb(${clampByte(r)},${clampByte(g)},${clampByte(b)})`;
          ctx.fillRect(x, y, 1, 1);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      if (repeat) {
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
      }
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }
